<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Fan Dashboard</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #0b0d12; --card-bg: rgba(26, 30, 41, 0.6); --card-border: rgba(255, 255, 255, 0.05); --accent: #00ff88; --accent-glow: rgba(0, 255, 136, 0.3); --temp: #ff5c5c; --temp-glow: rgba(255, 92, 92, 0.3); --text-main: #f0f2f5; --text-muted: #8b949e; --danger: #ff4b4b; --body-grad1: #161c27; --track-bg: rgba(255, 255, 255, 0.08); --thumb-bg: #fff; }
    [data-theme="light"] { --bg: #f0f2f5; --card-bg: rgba(255, 255, 255, 0.85); --card-border: rgba(0, 0, 0, 0.1); --accent: #00cc6a; --accent-glow: rgba(0, 204, 106, 0.3); --temp: #e63946; --temp-glow: rgba(230, 57, 70, 0.3); --text-main: #111827; --text-muted: #6b7280; --danger: #d90429; --body-grad1: #ffffff; --track-bg: rgba(0, 0, 0, 0.1); --thumb-bg: #fff; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, var(--body-grad1) 0%, var(--bg) 70%); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; overflow-x: hidden; transition: background 0.3s, color 0.3s; }
    .container { max-width: 440px; margin: 0 auto; padding: 30px 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: 0.5px; }
    .status-badge { display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.4); padding: 6px 12px; border-radius: 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border: 1px solid var(--card-border); color: var(--text-muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 2s infinite; }
    .dot.offline { background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: none; }
    .theme-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; font-size: 16px; padding: 0; line-height: 1; }
    .theme-btn:hover { box-shadow: 0 0 10px var(--bg); border-color: var(--card-bg); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .power-card { background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 24px; padding: 22px 24px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: background 0.3s, border 0.3s; }
    .power-info .label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .power-info .state { font-size: 20px; font-weight: 600; color: var(--text-main); }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider.round { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--track-bg); transition: .4s; border-radius: 34px; border: 1px solid var(--card-border); }
    .slider.round:before { position: absolute; content: ""; height: 26px; width: 26px; left: 3px; bottom: 3px; background-color: #8b949e; transition: .4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 50%; }
    input:checked + .slider.round { background-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); border-color: transparent; }
    input:checked + .slider.round:before { transform: translateX(26px); background-color: var(--thumb-bg); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .stat-card { background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 24px; padding: 22px 20px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: background 0.3s, border 0.3s; }
    .stat-card .icon { font-size: 24px; margin-bottom: 12px; display: block; }
    .stat-card .title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .stat-card .value { font-size: 32px; font-weight: 700; transition: color 0.3s; }
    .stat-card .unit { font-size: 14px; font-weight: 500; color: var(--text-muted); margin-left: 4px; }
    .stat-card.temp .value { color: var(--temp); text-shadow: 0 0 20px var(--temp-glow); }
    .stat-card.rpm .value { color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
    .glow-circle { position: absolute; right: -40px; top: -40px; width: 120px; height: 120px; border-radius: 50%; filter: blur(35px); opacity: 0.15; pointer-events: none; transition: background 0.3s; }
    .stat-card.temp .glow-circle { background: var(--temp); }
    .stat-card.rpm .glow-circle { background: var(--accent); }
    .fan-spin { display: inline-block; transform-origin: 50% 50%; animation: spin linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .control-panel { background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: background 0.3s, border 0.3s; }
    .control-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
    .control-header .title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .control-header .val { font-size: 28px; font-weight: 700; color: var(--text-main); }
    .control-header .unit { font-size: 14px; font-weight: 500; color: var(--text-muted); }
    input[type=range].single { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: var(--track-bg); border-radius: 6px; outline: none; margin: 15px 0; }
    input[type=range].single::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; background: linear-gradient(90deg, var(--accent) var(--fill, 50%), transparent var(--fill, 50%)); }
    input[type=range].single::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--thumb-bg); border: 3px solid var(--accent); box-shadow: 0 0 15px var(--accent-glow), 0 4px 10px rgba(0,0,0,0.5); margin-top: -11px; cursor: grab; transition: transform 0.1s; }
    input[type=range].single:active::-webkit-slider-thumb { transform: scale(1.1); cursor: grabbing; }
    .range-slider { position: relative; width: 100%; height: 30px; margin: 15px 0; }
    .range-slider input[type="range"] { position: absolute; left: 0; top: 12px; width: 100%; height: 6px; -webkit-appearance: none; appearance: none; background: transparent; pointer-events: none; margin: 0; outline: none; }
    .range-slider input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: transparent; border: none; }
    .range-slider input[type="range"]::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--thumb-bg); border: 3px solid var(--accent); box-shadow: 0 0 15px var(--accent-glow), 0 4px 10px rgba(0,0,0,0.2); cursor: grab; position: relative; z-index: 2; margin-top: -11px; }
    .range-slider input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.1); z-index: 3; cursor: grabbing; }
    .range-slider .track { position: absolute; left: 0; top: 12px; width: 100%; height: 6px; background: var(--track-bg); border-radius: 6px; z-index: 0; }
    .range-slider .fill { position: absolute; left: 0; top: 12px; height: 6px; background: var(--accent); border-radius: 6px; z-index: 1; }
    .range-slider.temp-slider .fill { background: var(--temp); }
    .range-slider.temp-slider input[type="range"]::-webkit-slider-thumb { border: 3px solid var(--temp); box-shadow: 0 0 15px var(--temp-glow), 0 4px 10px rgba(0,0,0,0.2); }
    .range-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Fan Control</h1>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="themeToggle" class="theme-btn" title="Переключить тему">☀️</button>
        <div class="status-badge"><div class="dot offline" id="statusDot"></div><span id="statusText">Офлайн</span></div>
      </div>
    </header>

    <div class="power-card">
      <div class="power-info">
        <div class="label">Питание мотора</div>
        <div class="state" id="powerStateText">Загрузка...</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="powerToggle" disabled>
        <span class="slider round"></span>
      </label>
    </div>

    <div class="grid">
      <div class="stat-card temp">
        <div class="glow-circle"></div>
        <span class="icon">🌡️</span>
        <div class="title">Температура</div>
        <div><span class="value" id="tempVal">--</span><span class="unit">°C</span></div>
      </div>
      <div class="stat-card rpm">
        <div class="glow-circle"></div>
        <span class="icon"><span id="fanIcon" class="fan-spin">🌀</span></span>
        <div class="title">Скорость</div>
        <div><span class="value" id="rpmVal">--</span><span class="unit">RPM</span></div>
      </div>
    </div>

    <div class="control-panel">
      <div class="control-header">
        <div class="title">Диапазон температур</div>
        <div><span class="val" id="tempRangeVal">22 - 30</span><span class="unit"> °C</span></div>
      </div>
      <div class="range-slider temp-slider">
        <div class="track"></div>
        <div class="fill" id="tempSliderFill"></div>
        <input type="range" id="tempMinSlider" min="10" max="50" step="1" value="22" disabled>
        <input type="range" id="tempMaxSlider" min="10" max="50" step="1" value="30" disabled>
      </div>
      <div class="range-labels"><span>10 °C</span><span>50 °C</span></div>
    </div>

    <div class="control-panel" style="margin-top: 16px;">
      <div class="control-header">
        <div class="title">Лимит оборотов</div>
        <div><span class="val" id="limitVal">--</span><span class="unit"> RPM</span></div>
      </div>
      <input type="range" id="rpmSlider" class="single" min="5000" max="45000" step="100" value="45000" disabled>
      <div class="range-labels"><span>5 000</span><span>45 000</span></div>
    </div>
  </div>

<script>
    const slider = document.getElementById('rpmSlider'), limitVal = document.getElementById('limitVal');
    const tempVal = document.getElementById('tempVal'), rpmVal = document.getElementById('rpmVal');
    const fanIcon = document.getElementById('fanIcon'), powerToggle = document.getElementById('powerToggle');
    const powerStateText = document.getElementById('powerStateText'), statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText'), themeToggle = document.getElementById('themeToggle');
    const tempMinSlider = document.getElementById('tempMinSlider'), tempMaxSlider = document.getElementById('tempMaxSlider');
    const tempSliderFill = document.getElementById('tempSliderFill'), tempRangeVal = document.getElementById('tempRangeVal');

    const MIN = 5000, MAX = 45000;
    let dragging = false, ignoreUpdatesUntil = 0, tempDragging = false, tempIgnoreUpdatesUntil = 0;
    let ws = null, isDark = true, dataReceived = false;

    function setControlsEnabled(enabled) { powerToggle.disabled = tempMinSlider.disabled = tempMaxSlider.disabled = slider.disabled = !enabled; }

    if (localStorage.getItem('theme') === 'light') {
      isDark = false; document.documentElement.setAttribute('data-theme', 'light'); themeToggle.textContent = '🌙';
    }

    themeToggle.addEventListener('click', () => {
      isDark = !isDark;
      if(isDark) { document.documentElement.removeAttribute('data-theme'); themeToggle.textContent = '☀️'; localStorage.setItem('theme', 'dark'); } 
      else { document.documentElement.setAttribute('data-theme', 'light'); themeToggle.textContent = '🌙'; localStorage.setItem('theme', 'light'); }
    });

    function formatNum(n) { return Math.round(n).toLocaleString('ru-RU'); }

    function updateFill() {
      const pct = (slider.value - MIN) / (MAX - MIN) * 100;
      slider.style.setProperty('--fill', pct + '%');
    }

    function updateTempSliderUI() {
      const minVal = parseInt(tempMinSlider.min), maxVal = parseInt(tempMinSlider.max);
      let min = parseInt(tempMinSlider.value), max = parseInt(tempMaxSlider.value);
      const pct1 = ((min - minVal) / (maxVal - minVal)) * 100, pct2 = ((max - minVal) / (maxVal - minVal)) * 100;
      tempSliderFill.style.left = pct1 + '%'; tempSliderFill.style.width = (pct2 - pct1) + '%';
      tempRangeVal.textContent = min + ' - ' + max;
    }

    function setPowerUI(isOn) {
      powerToggle.checked = isOn;
      powerStateText.textContent = isOn ? 'ВКЛЮЧЕН' : 'ВЫКЛЮЧЕН';
      powerStateText.style.color = isOn ? 'var(--text-main)' : 'var(--text-muted)';
    }

    function connectWS() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onopen = () => {
        statusDot.classList.remove('offline'); statusText.textContent = 'ОНЛАЙН';
        ws.send("init:");
      };
      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (!dataReceived) { dataReceived = true; setControlsEnabled(true); }
        
        if (typeof d.power === 'number') { 
          const isOn = d.power === 1; 
          if (powerToggle.checked !== isOn || powerStateText.textContent === 'Загрузка...') setPowerUI(isOn); 
        }
        
        // ПРОВЕРКА НАЛИЧИЯ ДАТЧИКА:
        if (typeof d.bmp_ok === 'number') {
          if (d.bmp_ok === 1) {
            // Датчик на связи
            if (typeof d.temp === 'number') { 
              const t = d.temp.toFixed(1); 
              if (tempVal.textContent !== t) tempVal.textContent = t; 
            }
          } else {
            // Датчик отвалился — рисуем прочерки
            if (tempVal.textContent !== '--') tempVal.textContent = '--';
          }
        }
        
        if (typeof d.current_rpm === 'number') {
          const rpmStr = formatNum(d.current_rpm);
          if (rpmVal.textContent !== rpmStr) {
            rpmVal.textContent = rpmStr;
            const speed = Math.max(0.4, Math.min(3, d.current_rpm / MAX * 3));
            fanIcon.style.animationDuration = (d.current_rpm > 50 ? (1 / speed) : 0) + 's';
          }
        }
        
        if (typeof d.max_rpm === 'number' && !dragging && Date.now() > ignoreUpdatesUntil) {
          if (slider.value != Math.round(d.max_rpm) || limitVal.textContent === '--') {
            slider.value = Math.round(d.max_rpm); limitVal.textContent = formatNum(d.max_rpm); updateFill();
          }
        }
        
        if (typeof d.temp_min === 'number' && typeof d.temp_max === 'number' && !tempDragging && Date.now() > tempIgnoreUpdatesUntil) {
          if (tempMinSlider.value != Math.round(d.temp_min) || tempMaxSlider.value != Math.round(d.temp_max)) {
            tempMinSlider.value = Math.round(d.temp_min); tempMaxSlider.value = Math.round(d.temp_max); updateTempSliderUI();
          }
        }
      };
      ws.onclose = () => {
        statusDot.classList.add('offline'); statusText.textContent = 'ПОИСК...';
        dataReceived = false; setControlsEnabled(false); setTimeout(connectWS, 1500);
      };
    }

    powerToggle.addEventListener('change', () => { const isOn = powerToggle.checked; setPowerUI(isOn); if (ws && ws.readyState === WebSocket.OPEN) ws.send("power:" + (isOn ? "1" : "0")); });
    slider.addEventListener('input', () => { dragging = true; limitVal.textContent = formatNum(slider.value); updateFill(); });
    slider.addEventListener('change', () => { dragging = false; ignoreUpdatesUntil = Date.now() + 1000; if (ws && ws.readyState === WebSocket.OPEN) ws.send("rpm:" + slider.value); });
    tempMinSlider.addEventListener('input', () => { let min = parseInt(tempMinSlider.value), max = parseInt(tempMaxSlider.value); if(min >= max - 1) tempMinSlider.value = max - 1; tempDragging = true; updateTempSliderUI(); });
    tempMaxSlider.addEventListener('input', () => { let min = parseInt(tempMinSlider.value), max = parseInt(tempMaxSlider.value); if(max <= min + 1) tempMaxSlider.value = min + 1; tempDragging = true; updateTempSliderUI(); });
    
    function sendTempRange() { tempDragging = false; tempIgnoreUpdatesUntil = Date.now() + 1000; if (ws && ws.readyState === WebSocket.OPEN) ws.send("temp_range:" + tempMinSlider.value + "," + tempMaxSlider.value); }
    tempMinSlider.addEventListener('change', sendTempRange); tempMaxSlider.addEventListener('change', sendTempRange);

    updateFill(); updateTempSliderUI(); connectWS();
  </script>
</body>
</html>
