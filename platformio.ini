[platformio]
; По умолчанию собирается ESP32-S3. Для классического ESP32: pio run -e esp32 -t upload
default_envs = heltec_wifi_lora_32_V3

; --- Общие настройки для обоих чипов ---
[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
board_build.embed_txtfiles = src/web/index.html
board_build.partitions = partitions.csv
; Прошивка рассчитана на 4 МБ флеша (подходит и для плат с 8 МБ)
board_upload.flash_size = 4MB

; --- ESP32-S3 (по умолчанию) ---
[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3

; --- Классический ESP32 ---
[env:esp32]
board = esp32dev
