[wokwi]
version = 1
firmware = ".pio/build/heltec_wifi_lora_32_V3/firmware.bin"
elf = ".pio/build/heltec_wifi_lora_32_V3/firmware.elf"

# Пробрасываем 80 порт ESP32 (веб-сервер) на 8180 порт локального компьютера
[[net.forward]]
from = "localhost:8180"
to = "target:80"

[[chip]]
name = 'bmp280'
# Скомпилировано из bmp280.chip.c командой:
#   wokwi-cli chip compile bmp280.chip.c -o bmp280.chip.wasm
# В diagram.json чип используется как "type": "chip-bmp280"
binary = 'bmp280.chip.wasm'

[[chip]]
name = 'mx1508'
# Модуль MX1508 + два микромотора с пропеллерами. Скомпилировано командой:
#   wokwi-cli chip compile mx1508.chip.c -o mx1508.chip.wasm
# В diagram.json чип используется как "type": "chip-mx1508"
binary = 'mx1508.chip.wasm'

[[chip]]
name = 'peltier'
# Visual two-wire Peltier element used as "chip-peltier" in diagram.json.
binary = 'peltier.chip.wasm'

